name: Coverage

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test-cov

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          carry-over-sources: true
          flag-name: npm run test-cov
          path-to-upload: ./coverage
