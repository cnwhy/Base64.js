name: Publish packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Build and test
        run: npm run verify

      - name: Pack tarball
        run: |
          mkdir -p dist-artifact
          npm pack --pack-destination dist-artifact
          echo "TARBALL=$(ls dist-artifact/*.tgz)" >> "$GITHUB_ENV"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist-artifact/*.tgz
          retention-days: 1

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: package
          path: .

      - name: Publish to npmjs.com
        run: |
          publish_tag="latest"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            publish_tag="${GITHUB_REF_NAME#*-}"
            publish_tag="${publish_tag%%.*}"
          fi
          npm publish ./*.tgz --provenance --access public --tag "$publish_tag"

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: package
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: ${{ github.repository_owner }}

      - name: Publish to GitHub Packages
        run: |
          publish_tag="latest"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            publish_tag="${GITHUB_REF_NAME#*-}"
            publish_tag="${publish_tag%%.*}"
          fi
          npm publish ./*.tgz --access public --tag "$publish_tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
