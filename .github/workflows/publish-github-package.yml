name: Publish to GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-github-package
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@cnwhy"

      - name: Install dependencies
        run: npm install

      - name: Verify package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Configure GitHub Packages authentication
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Publish to GitHub Packages
        run: |
          if npm view "@cnwhy/base64@${GITHUB_REF_NAME#v}" --registry=https://npm.pkg.github.com version >/dev/null 2>&1; then
            echo "GitHub Packages already contains ${GITHUB_REF_NAME#v}; skipping publish"
          else
            npm publish --access public --registry=https://npm.pkg.github.com
          fi

      - name: Publish to npmjs.com
        run: |
          if npm view "@cnwhy/base64@${GITHUB_REF_NAME#v}" --registry=https://registry.npmjs.org version >/dev/null 2>&1; then
            echo "npmjs.com already contains ${GITHUB_REF_NAME#v}; skipping publish"
          else
            npm publish --provenance --access public --registry=https://registry.npmjs.org
          fi
